<text x="1240.00" y="244.00" fill="#2f423a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">01 / SHELTERED ARRIVAL</text>
<text x="1240.00" y="274.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Two 10 × 18 ft parking reservations sit within</text>
<text x="1240.00" y="297.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">a 24 × 22 ft carport. A covered five-foot walk</text>
<text x="1240.00" y="320.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">runs behind the parking bays to the entry</text>
<text x="1240.00" y="343.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">landing.</text>
<text x="1240.00" y="436.00" fill="#2f423a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">02 / INDOOR AND OUTDOOR</text>
<text x="1240.00" y="466.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">The atrium is a garden room, not a required</text>
<text x="1240.00" y="489.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">passage. Rear living and dining open to a</text>
<text x="1240.00" y="512.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">separate terrace. Dashed lines indicate roof</text>
<text x="1240.00" y="535.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">edges and the covered arrival route.</text>
<text x="1240.00" y="629.00" fill="#2f423a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">03 / LANDSCAPE AND WATER</text>
<text x="1240.00" y="659.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Planting locations are illustrative. Reserve</text>
<text x="1240.00" y="682.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">roof outlets, accessible courtyard drains and a</text>
<text x="1240.00" y="705.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">positive overflow route away from thresholds;</text>
<text x="1240.00" y="728.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">final slopes and discharge need site design.</text>
<text x="1240.00" y="845.00" fill="#2f423a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="start">04 / LIMITS OF THIS STUDY</text>
<text x="1240.00" y="875.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">No surveyed boundaries, real road, north</text>
<text x="1240.00" y="898.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">orientation, climate or grade are asserted.</text>
<text x="1240.00" y="921.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Vehicle footprints are concept envelopes.</text>
<text x="1240.00" y="944.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Turning, runoff, foundations and accessibility</text>
<text x="1240.00" y="967.00" fill="#6b786d" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">require project-specific checks.</text>
