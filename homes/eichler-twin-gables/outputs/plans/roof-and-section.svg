<text x="75" y="1771" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#63756c" text-anchor="start" font-weight="400">CONCEPT DESIGN  /  Dimensions govern; do not scale. Site, products and engineering unverified.</text>
