<text x="850" y="660" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#63756c" text-anchor="start" font-weight="400">10&#x27; finished clear: office, dressing, bathrooms and support rooms.</text>
<text x="850" y="694" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#63756c" text-anchor="start" font-weight="400">12&#x27; finished clear: entry and dining. Primary bedrooms also vault.</text>
<text x="850" y="728" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#63756c" text-anchor="start" font-weight="400">Vault lining: 12&#x27;-2&quot; at eave to 17&#x27;-10&quot; near ridge.</text>
<text x="850" y="762" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#63756c" text-anchor="start" font-weight="400">Cover underside: 16&#x27;-4&quot; at rafter peak; 10&#x27;-9&quot; at wall.</text>
<text x="850" y="796" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#63756c" text-anchor="start" font-weight="400">Ridge cover underside: 16&#x27;-5&quot;; roof lining is higher.</text>
<text x="850" y="830" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#63756c" text-anchor="start" font-weight="400">Gable runoff is toward outer/courtyard eaves; low links have positive fall.</text>
<text x="850" y="864" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#63756c" text-anchor="start" font-weight="400">Gutters, overflow paths, weathering and discharge need detailed design.</text>
<text x="850" y="898" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#63756c" text-anchor="start" font-weight="400">Shown profiles are architectural allowances; steel sizing is unengineered.</text>
<text x="110" y="900" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#263b35" text-anchor="start" font-weight="700">AREA CONVENTION</text>
<text x="110" y="938" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#263b35" text-anchor="start" font-weight="400">68&#x27; x 60&#x27; envelope minus 20&#x27; x 36&#x27; open courtyard = 3,360 sq ft gross enclosed.</text>
<text x="110" y="970" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#63756c" text-anchor="start" font-weight="400">Gross planning-grid area includes wall allowances; excludes court, terraces, parking and roof overhangs. Not a cladding-face measurement.</text>
