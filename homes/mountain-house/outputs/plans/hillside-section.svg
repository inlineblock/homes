<text x="995" y="500" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#283b32" text-anchor="start" font-weight="400">Shaded patio</text>
<text x="55" y="670" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#283b32" text-anchor="start" font-weight="700">A usable outdoor sequence</text>
<text x="55" y="714" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#67736a" text-anchor="start" font-weight="400">Main living opens to a 1,128 sq ft rear deck and side return.</text>
<text x="55" y="749" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#67736a" text-anchor="start" font-weight="400">A partial pergola shades dining; the lounge retains open sky.</text>
<text x="55" y="784" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#67736a" text-anchor="start" font-weight="400">Posts and knee braces express the elevated deck structure.</text>
<text x="55" y="819" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#67736a" text-anchor="start" font-weight="400">The lower lounge opens to a graded patio bench before the hill falls away.</text>
<text x="55" y="881" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#67736a" text-anchor="start" font-weight="400">Area: 4,104 sq ft gross including garage; 3,528 sq ft conditioned gross.</text>
<text x="55" y="916" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#67736a" text-anchor="start" font-weight="400">The lower floor is L-shaped: there is no occupied room beneath the front garage.</text>
<text x="55" y="970" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#67736a" text-anchor="start" font-weight="400">Illustrative grading only: cut/fill, retaining, snow loads and drainage require site engineering.</text>
