<text x="900" y="1160" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#263b35" text-anchor="start" font-weight="700">Two equal private suites. One garden-focused public band.</text>
<text x="900" y="1200" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#63756c" text-anchor="start" font-weight="400">Front is at the bottom of the plan; no surveyed north is implied.</text>
<text x="900" y="1235" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#63756c" text-anchor="start" font-weight="400">Parking sits beside the house and is excluded from enclosed area.</text>
<text x="900" y="1270" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#63756c" text-anchor="start" font-weight="400">The approach uses continuous paving, with a separate pedestrian link.</text>
<text x="900" y="1305" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#63756c" text-anchor="start" font-weight="400">Opaque street entry opens into the courtyard reveal.</text>
<text x="900" y="1340" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#63756c" text-anchor="start" font-weight="400">Rear terrace connects living, dining and kitchen to the garden.</text>
<text x="900" y="1375" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#63756c" text-anchor="start" font-weight="400">Vehicle turning, setbacks, grading and discharge remain unverified.</text>
